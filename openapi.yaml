openapi: 3.0.3
info:
  title: Acortador de enlaces — API pública
  version: "0.1.0"
  description: >
    Contrato de la primera entrega del acortador de enlaces (issue #2).
    La API permite crear una asignación a partir de una URL de destino y
    resolver el enlace acortado hacia ese destino mientras la asignación
    esté vigente. Cada asignación dura exactamente 60 minutos desde su
    creación, tiene identidad propia y no se deduplica por destino.
servers:
  - url: /
    description: Mismo origen que sirve la web; la dirección pública del servicio es configurable por despliegue.
paths:
  /api/links:
    post:
      summary: Crear un enlace acortado
      description: >
        Crea una asignación independiente para la URL de destino recibida.
        Repetir la solicitud con el mismo destino produce otra asignación
        con identidad y vencimiento propios: no hay deduplicación ni
        idempotencia. El servidor no consulta la disponibilidad, permisos
        ni autenticación del destino para aceptarlo.
      operationId: crearEnlace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              valida:
                value:
                  destination: "https://docs.ejemplo.com/carpeta/archivo?a=1&b=2#seccion"
              lanConCredenciales:
                value:
                  destination: "http://usuario:clave@192.168.1.99:9000/carpeta%20compartida/recurso"
              dominioPunycode:
                value:
                  destination: "https://xn--bcher-kva.ch/secci%C3%B3n?nombre=jos%C3%A9"
      responses:
        '201':
          description: Asignación creada. El alias queda reservado para esta asignación durante su vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCreated'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '400':
          description: >
            Entrada rechazada. El destino no se trunca ni se corrige
            silenciosamente y ningún rechazo crea una asignación ni
            consume un alias. `error` es el código estable del motivo y
            `message` el texto legible que la web y los complementos
            muestran al usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                vacio:
                  summary: Destino ausente o vacío
                  value:
                    error: EMPTY_DESTINATION
                    message: "La URL de destino es obligatoria."
                demasiadoLargo:
                  summary: Más de 8.192 caracteres
                  value:
                    error: DESTINATION_TOO_LONG
                    message: "La URL de destino supera el máximo de 8192 caracteres."
                espaciosSinCodificar:
                  summary: Espacios u otros caracteres sin codificar
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                caracteresInternacionalesCrudos:
                  summary: Unicode sin codificar (usar %XX UTF-8 o punycode)
                  value:
                    error: MALFORMED_DESTINATION
                    message: "Los caracteres internacionales deben ir codificados (percent-encoding o dominio punycode)."
                escapePorcentajeInvalido:
                  summary: "% no seguido de dos dígitos hexadecimales (p. ej. %zz, %2)"
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                esquemaNoAdmitido:
                  summary: Esquema distinto de http/https o ausente
                  value:
                    error: UNSUPPORTED_SCHEME
                    message: "La URL de destino debe usar esquema http o https."
                origenPropio:
                  summary: Destino del propio servicio o equivalente localhost/LAN
                  value:
                    error: OWN_ORIGIN
                    message: "La URL de destino pertenece al propio acortador."
                cuerpoInvalido:
                  summary: Cuerpo ausente, JSON inválido o propiedades desconocidas
                  value:
                    error: INVALID_REQUEST
                    message: "El cuerpo de la solicitud no es un JSON válido del contrato."
  /{alias}:
    get:
      summary: Resolver un enlace acortado
      description: >
        Si el alias tiene una asignación vigente en el instante de
        resolución del servidor, responde HTTP 302 hacia la URL de destino
        conservada verbatim. Si el alias es desconocido o su asignación
        venció, responde HTTP 404 con una página «Este enlace no existe o
        venció». Ambas respuestas usan `Cache-Control: no-store` para que
        caches conformes no reutilicen una redirección vencida. Las rutas
        de la aplicación (por ejemplo `/api`, `/error` y los archivos
        estáticos) están reservadas y nunca se emiten como alias.
      operationId: resolverEnlace
      parameters:
        - name: alias
          in: path
          required: true
          description: >
            Código público del enlace. Alfabeto de 58 símbolos
            `123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz`
            (sin `0`, `O`, `I` ni `l`), sensible a mayúsculas, longitud
            variable comenzando por un carácter.
          schema:
            type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{1,32}$'
      responses:
        '302':
          description: Asignación vigente; redirección al destino registrado.
          headers:
            Location:
              required: true
              description: URL de destino exactamente como fue registrada.
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
        '404':
          description: Alias desconocido o sin asignación vigente.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
          content:
            text/html:
              schema:
                type: string
                description: Página que contiene el mensaje «Este enlace no existe o venció».
components:
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - destination
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 8192
          description: >
            URL de destino absoluta con esquema `http` o `https`
            (RFC 3986) y host presente. El límite es de 8.192 caracteres:
            8.192 se acepta y 8.193 se rechaza completo, nunca truncado.

            Codificación exigida (caracteres internacionales):

            - Solo se aceptan caracteres ASCII imprimibles según
              RFC 3986. Un destino con caracteres Unicode en crudo (en
              host, ruta, consulta o fragmento) se rechaza como
              `MALFORMED_DESTINATION`.
            - Un dominio internacional viaja en forma punycode
              (`xn--bcher-kva.ch`); el texto en ruta, consulta o
              fragmento viaja con percent-encoding UTF-8 (`%C3%A9`).
              Ambas formas válidas se aceptan y se conservan.
            - Un `%` que no forma un par de escape válido (`%zz`, `%2`,
              `%` suelto) se rechaza como `MALFORMED_DESTINATION`.
            - Los espacios sin codificar se rechazan; `%20` (en
              cualquier combinación de mayúsculas) se acepta.

            Conservación verbatim: parámetros de consulta repetidos,
            fragmento, credenciales incrustadas (`usuario:clave@`), puerto
            explícito y la codificación recibida se aceptan y se
            conservan exactamente, sin decodificar, normalizar ni
            reescribir. El servidor no consulta disponibilidad,
            autenticación ni permisos del destino: un destino inalcanzable
            de formato válido se acepta.

            Orígenes propios: se rechazan los destinos cuyo host y puerto
            efectivo (80/443 según el esquema cuando no hay puerto
            explícito) coinciden con los orígenes configurados del
            servicio: la dirección pública configurada, los equivalentes
            loopback (`localhost`, `127.0.0.1`, `::1`) del mismo puerto y
            los orígenes extra declarados en la configuración. La
            comparación es de origen: normaliza mayúsculas, punto final y
            corchetes IPv6, e ignora el esquema. Otro puerto u otro host
            de la red local no es origen propio y se acepta.
      additionalProperties: false
    LinkCreated:
      type: object
      required:
        - shortUrl
        - alias
        - expiresAt
        - reuseNotice
      properties:
        shortUrl:
          type: string
          format: uri
          description: >
            URL pública acortada: dirección base configurada del
            servicio más el alias. No se deriva de la solicitud recibida.
          example: "http://192.168.1.50:8080/7"
        alias:
          type: string
          pattern: '^[1-9A-HJ-NP-Za-km-z]{1,32}$'
          description: Código asignado dentro del alfabeto acordado.
          example: "7"
        expiresAt:
          type: string
          format: date-time
          description: Instante de vencimiento, exactamente 60 minutos después de la creación.
        reuseNotice:
          type: string
          description: >
            Aviso al usuario de que el alias puede reutilizarse con otro
            destino después del vencimiento.
          example: "Este alias puede reutilizarse con otro destino después del vencimiento."
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código estable del rechazo.
          enum:
            - EMPTY_DESTINATION
            - DESTINATION_TOO_LONG
            - MALFORMED_DESTINATION
            - UNSUPPORTED_SCHEME
            - OWN_ORIGIN
            - INVALID_REQUEST
        message:
          type: string
          description: Descripción legible del problema para mostrar al usuario.
      example:
        error: MALFORMED_DESTINATION
        message: "La URL de destino no tiene un formato válido."
