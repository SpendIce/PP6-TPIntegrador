openapi: 3.0.3
info:
  title: Acortador de enlaces — API pública
  version: "0.1.0"
  description: >
    Contrato del acortador de enlaces. La API permite crear una asignación
    a partir de una URL de destino y resolver el enlace acortado hacia ese
    destino mientras la asignación esté vigente. Cada asignación dura
    exactamente 60 minutos desde su creación, tiene identidad propia y no
    se deduplica por destino. El alias emitido puede ser un código
    reciclado de una asignación vencida: el mismo enlace o QR puede
    conducir a un destino nuevo después del vencimiento. La etapa 2 suma
    el inicio de sesión con Google (issue #19): `GET
    /oauth2/authorization/google` inicia el flujo OIDC que vuelve por
    `/login/oauth2/code/google` y deja una sesión principal persistida;
    `GET /api/sesion` la consulta y `POST /api/logout` la cierra.
servers:
  - url: /
    description: Mismo origen que sirve la web; la dirección pública del servicio es configurable por despliegue.
paths:
  /api/csrf:
    get:
      summary: Obtener el token CSRF
      description: >
        Emite el token CSRF del doble envío que exige
        `POST /api/links`: fija la cookie `XSRF-TOKEN` (legible por el
        cliente) y devuelve el mismo valor en el cuerpo, para los
        clientes que no pueden leer `Set-Cookie` (las extensiones). No
        crea sesión ni exige autenticación: cualquier cliente lo obtiene
        antes de su primer POST y lo reutiliza o renueva con otro GET.
      operationId: obtenerTokenCsrf
      responses:
        '200':
          description: >
            Token vigente. La cookie `XSRF-TOKEN` lo repite y solo se fija con
            `Set-Cookie` cuando la solicitud todavía no la trae.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: >
                `XSRF-TOKEN=<token>; Path=/` — cookie legible (no HttpOnly).
                Se fija solo cuando la solicitud no trae una cookie previa.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/links:
    post:
      summary: Crear un enlace acortado
      description: >
        Crea una asignación independiente para la URL de destino recibida.
        Repetir la solicitud con el mismo destino produce otra asignación
        con identidad y vencimiento propios: no hay deduplicación ni
        idempotencia. El servidor no consulta la disponibilidad, permisos
        ni autenticación del destino para aceptarlo. El alias reservado es
        preferentemente uno cuya asignación anterior venció (los más
        cortos primero) o, sin vencidos reutilizables, el siguiente código
        nunca usado de la menor longitud disponible. La solicitud exige el
        token CSRF del doble envío: la cookie `XSRF-TOKEN` y el encabezado
        `X-XSRF-TOKEN` con el mismo valor que la cookie de la solicitud.
      operationId: crearEnlace
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: >
            Valor de la cookie `XSRF-TOKEN` de la misma solicitud. El
            servidor no firma ni guarda tokens: acepta cualquier par
            cookie/encabezado coincidente, y el ataque cross-site no puede
            leer la cookie para repetirla.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              valida:
                value:
                  destination: "https://docs.ejemplo.com/carpeta/archivo?a=1&b=2#seccion"
              lanConCredenciales:
                value:
                  destination: "http://usuario:clave@192.168.1.99:9000/carpeta%20compartida/recurso"
              dominioPunycode:
                value:
                  destination: "https://xn--bcher-kva.ch/secci%C3%B3n?nombre=jos%C3%A9"
      responses:
        '201':
          description: Asignación creada. El alias queda reservado para esta asignación durante su vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCreated'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '400':
          description: >
            Entrada rechazada. El destino no se trunca ni se corrige
            silenciosamente y ningún rechazo crea una asignación ni
            consume un alias. `error` es el código estable del motivo y
            `message` el texto legible que la web y los complementos
            muestran al usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                vacio:
                  summary: Destino ausente o vacío
                  value:
                    error: EMPTY_DESTINATION
                    message: "La URL de destino es obligatoria."
                demasiadoLargo:
                  summary: Más de 8.192 caracteres
                  value:
                    error: DESTINATION_TOO_LONG
                    message: "La URL de destino supera el máximo de 8192 caracteres."
                espaciosSinCodificar:
                  summary: Espacios u otros caracteres sin codificar
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                caracteresInternacionalesCrudos:
                  summary: Unicode sin codificar (usar %XX UTF-8 o punycode)
                  value:
                    error: MALFORMED_DESTINATION
                    message: "Los caracteres internacionales deben ir codificados (percent-encoding o dominio punycode)."
                escapePorcentajeInvalido:
                  summary: "% no seguido de dos dígitos hexadecimales (p. ej. %zz, %2)"
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                esquemaNoAdmitido:
                  summary: Esquema distinto de http/https o ausente
                  value:
                    error: UNSUPPORTED_SCHEME
                    message: "La URL de destino debe usar esquema http o https."
                origenPropio:
                  summary: Destino del propio servicio o equivalente localhost/LAN
                  value:
                    error: OWN_ORIGIN
                    message: "La URL de destino pertenece al propio acortador."
                cuerpoInvalido:
                  summary: Cuerpo ausente, JSON inválido o propiedades desconocidas
                  value:
                    error: INVALID_REQUEST
                    message: "El cuerpo de la solicitud no es un JSON válido del contrato."
        '403':
          description: >
            Token CSRF ausente o inválido: falta el encabezado
            `X-XSRF-TOKEN`, falta la cookie `XSRF-TOKEN` o sus valores no
            coinciden entre sí. El servidor no guarda ni firma tokens: el
            doble envío solo exige que el encabezado repita la cookie de la
            misma solicitud. Ningún rechazo crea una asignación ni consume
            un alias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                csrfInvalido:
                  summary: Sin cookie, sin encabezado o valores que no coinciden
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
  /api/sesion:
    get:
      summary: Consultar la sesión actual
      description: >
        Devuelve el usuario de la sesión del dispositivo que consulta,
        identificado por la cookie `SESSION`. Sin sesión válida el
        usuario es `null`: el contrato no distingue «sin sesión» de
        «sesión sin usuario». El inicio de sesión con Google no pasa por
        esta API: la web navega a `/oauth2/authorization/google` y el
        proveedor vuelve por `/login/oauth2/code/google`, que deja una
        sesión principal persistida (sobrevive a los reinicios del
        servicio y vence tras la inactividad máxima configurada, 30 días
        por defecto). `tipo` identifica cómo se abrió la sesión: hoy solo
        existe `principal` (login directo con Google); la vinculación por
        QR sumará `vinculada`.
      operationId: sesionActual
      responses:
        '200':
          description: >
            Estado de la sesión actual. `usuario` es `null` cuando no hay
            sesión o la sesión no tiene usuario.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
              examples:
                sinSesion:
                  summary: Sin sesión o sin usuario
                  value:
                    usuario: null
                conSesion:
                  summary: Sesión principal iniciada
                  value:
                    usuario:
                      email: "juan@ejemplo.com"
                      namespace: ""
                      tipo: "principal"
  /api/logout:
    post:
      summary: Cerrar sesión
      description: >
        Invalida la sesión del dispositivo actual: la cookie `SESSION`
        deja de identificar una sesión y el servidor la elimina de las
        persistidas. Sin sesión, responde igual. La solicitud exige el
        token CSRF del doble envío: la cookie `XSRF-TOKEN` y el encabezado
        `X-XSRF-TOKEN` con el mismo valor que la cookie de la solicitud.
      operationId: cerrarSesion
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: >
            Valor de la cookie `XSRF-TOKEN` de la misma solicitud.
          schema:
            type: string
      responses:
        '204':
          description: Sesión cerrada (o inexistente); no devuelve cuerpo.
        '403':
          description: >
            Token CSRF ausente o inválido: falta el encabezado
            `X-XSRF-TOKEN`, falta la cookie `XSRF-TOKEN` o sus valores no
            coinciden entre sí.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                csrfInvalido:
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
  /{alias}:
    get:
      summary: Resolver un enlace acortado
      description: >
        Si el alias tiene una asignación vigente en el instante de
        resolución del servidor, responde HTTP 302 hacia la URL de destino
        conservada verbatim. Si el alias es desconocido o su asignación
        venció, responde HTTP 404 con una página «Este enlace no existe o
        venció». La vigencia se evalúa únicamente en el instante en que el
        servidor resuelve: una redirección emitida antes del vencimiento
        conserva su validez aunque llegue al cliente después, y las
        visitas no renuevan el vencimiento. Las asignaciones vencidas se
        conservan en el historial; no hay borrado ni tarea de limpieza.
        Un alias reasignado conduce al destino de su asignación vigente:
        el mismo enlace o un QR antiguo puede resolver a un destino nuevo.
        Ambas respuestas usan `Cache-Control: no-store` para que
        caches conformes no reutilicen una redirección vencida. Las rutas
        de la aplicación (por ejemplo `/api`, `/error` y los archivos
        estáticos) están reservadas y nunca se emiten como alias.
      operationId: resolverEnlace
      parameters:
        - name: alias
          in: path
          required: true
          description: >
            Código público del enlace. Alfabeto de 58 símbolos
            `123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz`
            (sin `0`, `O`, `I` ni `l`), sensible a mayúsculas, longitud
            variable comenzando por un carácter.
          schema:
            type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{1,32}$'
      responses:
        '302':
          description: Asignación vigente; redirección al destino registrado.
          headers:
            Location:
              required: true
              description: URL de destino exactamente como fue registrada.
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
        '404':
          description: Alias desconocido o sin asignación vigente.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
          content:
            text/html:
              schema:
                type: string
                description: Página que contiene el mensaje «Este enlace no existe o venció».
components:
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - destination
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 8192
          description: >
            URL de destino absoluta con esquema `http` o `https`
            (RFC 3986) y host presente. El límite es de 8.192 caracteres:
            8.192 se acepta y 8.193 se rechaza completo, nunca truncado.

            Codificación exigida (caracteres internacionales):

            - El destino debe ser una URI formada solo por caracteres
              ASCII válidos según la gramática de RFC 3986 (los
              caracteres de control y los delimitadores fuera de lugar
              también se rechazan). Un destino con caracteres Unicode en
              crudo (en host, ruta, consulta o fragmento) se rechaza
              como `MALFORMED_DESTINATION`.
            - Un dominio internacional viaja en forma punycode
              (`xn--bcher-kva.ch`); el texto en ruta, consulta o
              fragmento viaja con percent-encoding UTF-8 (`%C3%A9`).
              Ambas formas válidas se aceptan y se conservan.
            - Un `%` que no forma un par de escape válido (`%zz`, `%2`,
              `%` suelto) se rechaza como `MALFORMED_DESTINATION`.
            - Los espacios sin codificar se rechazan; `%20` (en
              cualquier combinación de mayúsculas) se acepta.

            Conservación verbatim: parámetros de consulta repetidos,
            fragmento, credenciales incrustadas (`usuario:clave@`), puerto
            explícito y la codificación recibida se aceptan y se
            conservan exactamente, sin decodificar, normalizar ni
            reescribir. El servidor no consulta disponibilidad,
            autenticación ni permisos del destino: un destino inalcanzable
            de formato válido se acepta.

            Orígenes propios: se rechazan los destinos cuyo host y puerto
            efectivo (80/443 según el esquema cuando no hay puerto
            explícito) coinciden con los orígenes configurados del
            servicio: la dirección pública configurada, los equivalentes
            loopback (`localhost`, `127.0.0.1`, `::1`) del mismo puerto y
            los orígenes extra declarados en la configuración. La
            comparación es de origen: normaliza mayúsculas, punto final y
            corchetes IPv6, e ignora el esquema. Otro puerto u otro host
            de la red local no es origen propio y se acepta.
      additionalProperties: false
    LinkCreated:
      type: object
      required:
        - shortUrl
        - alias
        - expiresAt
        - reuseNotice
      properties:
        shortUrl:
          type: string
          format: uri
          description: >
            URL pública acortada: dirección base configurada del
            servicio más el alias. No se deriva de la solicitud recibida.
          example: "http://192.168.1.50:8080/7"
        alias:
          type: string
          pattern: '^[1-9A-HJ-NP-Za-km-z]{1,32}$'
          description: Código asignado dentro del alfabeto acordado.
          example: "7"
        expiresAt:
          type: string
          format: date-time
          description: Instante de vencimiento, exactamente 60 minutos después de la creación.
        reuseNotice:
          type: string
          description: >
            Aviso al usuario de que el alias puede reutilizarse con otro
            destino después del vencimiento.
          example: "Este alias puede reutilizarse con otro destino después del vencimiento."
    CsrfToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: >
            Valor del token CSRF; la cookie `XSRF-TOKEN` lo repite (se fija
            cuando la solicitud no la trae) y se repite en el encabezado
            `X-XSRF-TOKEN` de los POST.
          example: "f1d2d2f9-4e5a-4b6c-8d7e-9f0a1b2c3d4e"
    SesionActual:
      type: object
      required:
        - usuario
      properties:
        usuario:
          # En OpenAPI 3.0.3 `nullable` solo amplía el `type` del mismo
          # Schema Object: con un `$ref` o un `allOf` el validador sigue
          # exigiendo el objeto. Por eso el usuario va inline.
          nullable: true
          type: object
          description: >
            Usuario de la sesión actual; `null` cuando no hay sesión o la
            sesión no tiene usuario.
          required:
            - email
            - namespace
            - tipo
          properties:
            email:
              type: string
              format: email
              description: Email de la cuenta de Google del usuario.
              example: "juan@ejemplo.com"
            namespace:
              type: string
              description: >
                Namespace público del usuario; vacío hasta que lo elija (la
                elección es un Change posterior).
              example: ""
            tipo:
              type: string
              description: >
                Tipo de la sesión actual: `principal` es la abierta con login
                directo de Google; `vinculada` se reserva para la vinculación
                por QR.
          enum:
            - principal
            - vinculada
          example: "principal"
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código estable del rechazo.
          enum:
            - EMPTY_DESTINATION
            - DESTINATION_TOO_LONG
            - MALFORMED_DESTINATION
            - UNSUPPORTED_SCHEME
            - OWN_ORIGIN
            - INVALID_REQUEST
            - CSRF_TOKEN_INVALID
        message:
          type: string
          description: Descripción legible del problema para mostrar al usuario.
      example:
        error: MALFORMED_DESTINATION
        message: "La URL de destino no tiene un formato válido."
