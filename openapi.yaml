openapi: 3.0.3
info:
  title: Acortador de enlaces — API pública
  version: "0.1.0"
  description: >
    Contrato del acortador de enlaces. La API permite crear una asignación
    a partir de una URL de destino y resolver el enlace acortado hacia ese
    destino mientras la asignación esté vigente. Cada asignación dura
    exactamente 60 minutos desde su creación, tiene identidad propia y no
    se deduplica por destino. El alias emitido puede ser un código
    reciclado de una asignación vencida: el mismo enlace o QR puede
    conducir a un destino nuevo después del vencimiento. La etapa 2 suma
    el inicio de sesión con Google (issue #19): `GET
    /oauth2/authorization/google` inicia el flujo OIDC que vuelve por
    `/login/oauth2/code/google` y deja una sesión principal persistida;
    `GET /api/sesion` la consulta y `POST /api/logout` la cierra. El issue
    #20 suma la elección del namespace del primer login: `POST
    /api/namespace` lo registra y `GET /api/namespace/sugerencia` propone
    un nombre derivado de la parte local del email. El issue #21 suma los
    enlaces personales: `POST /api/links` acepta un `aliasPersonalizado`
    opcional (con sesión y namespace elegido) y `GET
    /{namespace}/{aliasPersonalizado}` lo resuelve igual que el enlace
    acortado de un segmento.
servers:
  - url: /
    description: Mismo origen que sirve la web; la dirección pública del servicio es configurable por despliegue.
paths:
  /api/csrf:
    get:
      summary: Obtener el token CSRF
      description: >
        Emite el token CSRF del doble envío que exige
        `POST /api/links`: fija la cookie `XSRF-TOKEN` (legible por el
        cliente) y devuelve el mismo valor en el cuerpo, para los
        clientes que no pueden leer `Set-Cookie` (las extensiones). No
        crea sesión ni exige autenticación: cualquier cliente lo obtiene
        antes de su primer POST y lo reutiliza o renueva con otro GET.
      operationId: obtenerTokenCsrf
      responses:
        '200':
          description: >
            Token vigente. La cookie `XSRF-TOKEN` lo repite y solo se fija con
            `Set-Cookie` cuando la solicitud todavía no la trae.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: >
                `XSRF-TOKEN=<token>; Path=/` — cookie legible (no HttpOnly).
                Se fija solo cuando la solicitud no trae una cookie previa.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/links:
    post:
      summary: Crear un enlace acortado o un enlace personal
      description: >
        Crea una asignación independiente para la URL de destino recibida.
        Repetir la solicitud con el mismo destino produce otra asignación
        con identidad y vencimiento propios: no hay deduplicación ni
        idempotencia. El servidor no consulta la disponibilidad, permisos
        ni autenticación del destino para aceptarlo. Con
        `aliasPersonalizado` ausente, vacío o nulo se crea un enlace
        acortado como siempre: el alias reservado es preferentemente uno
        cuya asignación anterior venció (los más cortos primero) o, sin
        vencidos reutilizables, el siguiente código nunca usado de la
        menor longitud disponible. Con `aliasPersonalizado` se crea un
        enlace personal del usuario de la sesión, publicado como
        `/{namespace}/{aliasPersonalizado}`: exige sesión iniciada
        (`401` sin ella) y namespace elegido (`NAMESPACE_NOT_CHOSEN`),
        y el alias no puede repetir uno vigente del mismo usuario
        (`ALIAS_TAKEN`), aunque otro usuario sí puede usar el mismo
        texto en su propio namespace. La solicitud exige el token CSRF
        del doble envío: la cookie `XSRF-TOKEN` y el encabezado
        `X-XSRF-TOKEN` con el mismo valor que la cookie de la solicitud.
      operationId: crearEnlace
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: >
            Valor de la cookie `XSRF-TOKEN` de la misma solicitud. El
            servidor no firma ni guarda tokens: acepta cualquier par
            cookie/encabezado coincidente, y el ataque cross-site no puede
            leer la cookie para repetirla.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              valida:
                value:
                  destination: "https://docs.ejemplo.com/carpeta/archivo?a=1&b=2#seccion"
              lanConCredenciales:
                value:
                  destination: "http://usuario:clave@192.168.1.99:9000/carpeta%20compartida/recurso"
              dominioPunycode:
                value:
                  destination: "https://xn--bcher-kva.ch/secci%C3%B3n?nombre=jos%C3%A9"
      responses:
        '201':
          description: >
            Asignación creada. Con `aliasPersonalizado` el enlace es el
            personal (`/{namespace}/{aliasPersonalizado}`); sin él, el
            alias reservado queda para esta asignación durante su vigencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCreated'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        '400':
          description: >
            Entrada rechazada. El destino no se trunca ni se corrige
            silenciosamente y ningún rechazo crea una asignación ni
            consume un alias. `error` es el código estable del motivo y
            `message` el texto legible que la web y los complementos
            muestran al usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                vacio:
                  summary: Destino ausente o vacío
                  value:
                    error: EMPTY_DESTINATION
                    message: "La URL de destino es obligatoria."
                demasiadoLargo:
                  summary: Más de 8.192 caracteres
                  value:
                    error: DESTINATION_TOO_LONG
                    message: "La URL de destino supera el máximo de 8192 caracteres."
                espaciosSinCodificar:
                  summary: Espacios u otros caracteres sin codificar
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                caracteresInternacionalesCrudos:
                  summary: Unicode sin codificar (usar %XX UTF-8 o punycode)
                  value:
                    error: MALFORMED_DESTINATION
                    message: "Los caracteres internacionales deben ir codificados (percent-encoding o dominio punycode)."
                escapePorcentajeInvalido:
                  summary: "% no seguido de dos dígitos hexadecimales (p. ej. %zz, %2)"
                  value:
                    error: MALFORMED_DESTINATION
                    message: "La URL de destino no tiene un formato válido."
                esquemaNoAdmitido:
                  summary: Esquema distinto de http/https o ausente
                  value:
                    error: UNSUPPORTED_SCHEME
                    message: "La URL de destino debe usar esquema http o https."
                origenPropio:
                  summary: Destino del propio servicio o equivalente localhost/LAN
                  value:
                    error: OWN_ORIGIN
                    message: "La URL de destino pertenece al propio acortador."
                cuerpoInvalido:
                  summary: Cuerpo ausente, JSON inválido o propiedades desconocidas
                  value:
                    error: INVALID_REQUEST
                    message: "El cuerpo de la solicitud no es un JSON válido del contrato."
                aliasInvalido:
                  summary: Alias personalizado fuera de formato
                  value:
                    error: ALIAS_INVALID
                    message: "El alias personalizado debe tener entre 1 y 50 caracteres a-z, 0-9 y -."
        '401':
          description: >
            Se pidió `aliasPersonalizado` sin sesión con usuario
            autenticado. Sin `aliasPersonalizado` la creación sigue siendo
            anónima.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                sinSesion:
                  value:
                    error: NOT_AUTHENTICATED
                    message: "Iniciá sesión con Google para crear enlaces personales."
        '403':
          description: >
            Token CSRF ausente o inválido: falta el encabezado
            `X-XSRF-TOKEN`, falta la cookie `XSRF-TOKEN` o sus valores no
            coinciden entre sí. El servidor no guarda ni firma tokens: el
            doble envío solo exige que el encabezado repita la cookie de la
            misma solicitud. Ningún rechazo crea una asignación ni consume
            un alias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                csrfInvalido:
                  summary: Sin cookie, sin encabezado o valores que no coinciden
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
        '409':
          description: >
            Conflicto de estado con `aliasPersonalizado`: el usuario de la
            sesión ya tiene un enlace personal vigente con ese alias
            (`ALIAS_TAKEN`) o todavía no eligió su namespace
            (`NAMESPACE_NOT_CHOSEN`). Otro usuario puede usar el mismo
            alias personalizado en su propio namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                aliasVigente:
                  summary: El usuario ya tiene ese alias vigente
                  value:
                    error: ALIAS_TAKEN
                    message: "Ya tenés un enlace personal vigente con el alias 'mi-doc'; probá con otro."
                sinNamespace:
                  summary: Falta elegir el namespace
                  value:
                    error: NAMESPACE_NOT_CHOSEN
                    message: "Elegí tu namespace para crear enlaces personales."
  /api/sesion:
    get:
      summary: Consultar la sesión actual
      description: >
        Devuelve el usuario de la sesión del dispositivo que consulta,
        identificado por la cookie `SESSION`. Sin sesión válida el
        usuario es `null`: el contrato no distingue «sin sesión» de
        «sesión sin usuario». El inicio de sesión con Google no pasa por
        esta API: la web navega a `/oauth2/authorization/google` y el
        proveedor vuelve por `/login/oauth2/code/google`, que deja una
        sesión principal persistida (sobrevive a los reinicios del
        servicio y vence tras la inactividad máxima configurada, 30 días
        por defecto). `tipo` identifica cómo se abrió la sesión: hoy solo
        existe `principal` (login directo con Google); la vinculación por
        QR sumará `vinculada`.
      operationId: sesionActual
      responses:
        '200':
          description: >
            Estado de la sesión actual. `usuario` es `null` cuando no hay
            sesión o la sesión no tiene usuario.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
              examples:
                sinSesion:
                  summary: Sin sesión o sin usuario
                  value:
                    usuario: null
                conSesion:
                  summary: Sesión principal iniciada sin namespace elegido
                  value:
                    usuario:
                      email: "juan@ejemplo.com"
                      namespace: ""
                      tipo: "principal"
                      sugerencia: "juan"
  /api/namespace:
    post:
      summary: Elegir el namespace en el primer login
      description: >
        Registra el namespace del usuario de la sesión actual, que no
        puede tener otro: la repetición del mismo nombre es idempotente y
        cualquier nombre distinto se rechaza con
        `NAMESPACE_ALREADY_CHOSEN` (el cambio llega en otro Change). El
        nombre se normaliza a minúsculas antes de validar y guardar, así
        que `Juan` es válido y ocupa `juan`. El formato es de 3 a 30
        caracteres `a-z`, `0-9` y `-`, sin guion inicial ni final; los
        nombres reservados por configuración (`NAMESPACE_RESERVED_NAMES`,
        por defecto las rutas del sistema `api`, `login`, `logout`,
        `vincular`, `oauth2` y `error`) no se pueden elegir. La unicidad
        es sin distinguir mayúsculas: si `juan` existe, `JUAN` se rechaza
        con `NAMESPACE_TAKEN`. Dos usuarios que piden el mismo nombre a la
        vez nunca terminan ambos con él: la restricción única de la base
        decide y el perdedor recibe `NAMESPACE_TAKEN`. Exige el token CSRF
        del doble envío, como todo POST.
      operationId: elegirNamespace
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Valor de la cookie `XSRF-TOKEN` de la misma solicitud.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElegirNamespaceRequest'
            examples:
              valido:
                value:
                  namespace: "juan"
      responses:
        '200':
          description: Namespace elegido; devuelve la sesión actual ya actualizada.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
              examples:
                elegido:
                  value:
                    usuario:
                      email: "juan@ejemplo.com"
                      namespace: "juan"
                      tipo: "principal"
                      sugerencia: ""
        '400':
          description: >
            El namespace no cumple el formato (`NAMESPACE_INVALID`) o es
            un nombre reservado (`NAMESPACE_RESERVED`). Ningún rechazo
            guarda el nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                formatoInvalido:
                  value:
                    error: NAMESPACE_INVALID
                    message: "El namespace debe tener entre 3 y 30 caracteres a-z, 0-9 y -, sin guion inicial ni final."
                reservado:
                  value:
                    error: NAMESPACE_RESERVED
                    message: "El namespace 'api' está reservado por el sistema; probá con otro."
        '401':
          description: No hay sesión con usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                sinSesion:
                  value:
                    error: NOT_AUTHENTICATED
                    message: "Iniciá sesión con Google para elegir tu namespace."
        '403':
          description: Token CSRF ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                csrfInvalido:
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
        '409':
          description: >
            El nombre ya lo tiene otro usuario (`NAMESPACE_TAKEN`) o el
            usuario de la sesión ya eligió otro (`NAMESPACE_ALREADY_CHOSEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                tomado:
                  value:
                    error: NAMESPACE_TAKEN
                    message: "El namespace 'juan' ya está tomado; probá con otro."
                yaElegido:
                  value:
                    error: NAMESPACE_ALREADY_CHOSEN
                    message: "Ya elegiste el namespace 'juan'; cambiarlo llega en otro ticket."
  /api/namespace/sugerencia:
    get:
      summary: Sugerir un namespace para el primer login
      description: >
        Devuelve un nombre derivado de la parte local del email del
        usuario de la sesión, adaptado al formato: minúsculas, caracteres
        inválidos reemplazados por `-`, guiones repetidos colapsados y sin
        guion inicial ni final. Es solo una sugerencia y no se reserva:
        si ya está tomada, la web deja escribir otro nombre. Responde
        `Cache-Control: no-store`.
      operationId: sugerirNamespace
      responses:
        '200':
          description: Sugerencia calculada a partir del email de la sesión.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceSugerencia'
              examples:
                desdeEmail:
                  value:
                    sugerencia: "juan-perez"
        '401':
          description: No hay sesión con usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                sinSesion:
                  value:
                    error: NOT_AUTHENTICATED
                    message: "Iniciá sesión con Google para elegir tu namespace."
  /api/logout:
    post:
      summary: Cerrar sesión
      description: >
        Invalida la sesión del dispositivo actual: la cookie `SESSION`
        deja de identificar una sesión y el servidor la elimina de las
        persistidas. Sin sesión, responde igual. La solicitud exige el
        token CSRF del doble envío: la cookie `XSRF-TOKEN` y el encabezado
        `X-XSRF-TOKEN` con el mismo valor que la cookie de la solicitud.
      operationId: cerrarSesion
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: >
            Valor de la cookie `XSRF-TOKEN` de la misma solicitud.
          schema:
            type: string
      responses:
        '204':
          description: Sesión cerrada (o inexistente); no devuelve cuerpo.
        '403':
          description: >
            Token CSRF ausente o inválido: falta el encabezado
            `X-XSRF-TOKEN`, falta la cookie `XSRF-TOKEN` o sus valores no
            coinciden entre sí.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                csrfInvalido:
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
  /api/sesiones-vinculadas/cerrar:
    post:
      summary: Cerrar todas las sesiones vinculadas
      description: >
        Desde una sesión principal, invalida todas las sesiones vinculadas
        del usuario autenticado. La sesión principal que realiza la solicitud
        y las sesiones de otros usuarios permanecen activas. Una sesión
        vinculada no puede ejecutar esta operación y recibe
        `SESSION_NOT_PRIMARY`. Exige el token CSRF del doble envío.
      operationId: cerrarSesionesVinculadas
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Valor de la cookie `XSRF-TOKEN` de la misma solicitud.
          schema:
            type: string
      responses:
        '204':
          description: Sesiones vinculadas cerradas; no devuelve cuerpo.
        '401':
          description: No hay sesión con usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                sinSesion:
                  value:
                    error: NOT_AUTHENTICATED
                    message: "Iniciá sesión con Google para cerrar las sesiones vinculadas."
        '403':
          description: >
            La sesión actual es vinculada (`SESSION_NOT_PRIMARY`) o el token
            CSRF es ausente o inválido (`CSRF_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                sesionVinculada:
                  value:
                    error: SESSION_NOT_PRIMARY
                    message: "Solo una sesión principal puede cerrar las sesiones vinculadas."
                csrfInvalido:
                  value:
                    error: CSRF_TOKEN_INVALID
                    message: "La solicitud no trae un token CSRF válido; se obtiene con GET /api/csrf."
  /{namespace}/{aliasPersonalizado}:
    get:
      summary: Resolver un enlace personal
      description: >
        Si el namespace identifica a un usuario y su enlace personal con
        ese alias tiene una asignación vigente en el instante de
        resolución del servidor, responde HTTP 302 hacia la URL de
        destino conservada verbatim. Sin usuario con ese namespace, sin
        enlace personal con ese alias o con la asignación vencida,
        responde HTTP 404 con la página «Este enlace no existe o
        venció», igual que el enlace acortado de un segmento. Las
        asignaciones personales pertenecen al usuario y se conservan en
        el historial: al vencer, el mismo usuario puede volver a usar el
        alias, y otro usuario con el mismo texto de namespace crea una
        asignación distinta. La comparación no distingue mayúsculas:
        ambos segmentos se normalizan a minúsculas. Ambas respuestas
        usan `Cache-Control: no-store`. Un camino de un solo segmento
        sigue resolviendo los alias de los enlaces acortados aunque
        coincida con un namespace: `/juan` es el alias `juan` y nunca un
        perfil.
      operationId: resolverEnlacePersonal
      parameters:
        - name: namespace
          in: path
          required: true
          description: >
            Namespace del usuario dueño del enlace personal. Se
            normaliza a minúsculas.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9-]{3,30}$'
        - name: aliasPersonalizado
          in: path
          required: true
          description: >
            Alias que el usuario eligió para el enlace personal. Se
            normaliza a minúsculas.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9-]{1,50}$'
      responses:
        '302':
          description: Asignación vigente; redirección al destino registrado.
          headers:
            Location:
              required: true
              description: URL de destino exactamente como fue registrada.
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
        '404':
          description: Alias desconocido o sin asignación vigente.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
          content:
            text/html:
              schema:
                type: string
                description: Página que contiene el mensaje «Este enlace no existe o venció».
  /{alias}:
    get:
      summary: Resolver un enlace acortado
      description: >
        Si el alias tiene una asignación vigente en el instante de
        resolución del servidor, responde HTTP 302 hacia la URL de destino
        conservada verbatim. Si el alias es desconocido o su asignación
        venció, responde HTTP 404 con una página «Este enlace no existe o
        venció». La vigencia se evalúa únicamente en el instante en que el
        servidor resuelve: una redirección emitida antes del vencimiento
        conserva su validez aunque llegue al cliente después, y las
        visitas no renuevan el vencimiento. Las asignaciones vencidas se
        conservan en el historial; no hay borrado ni tarea de limpieza.
        Un alias reasignado conduce al destino de su asignación vigente:
        el mismo enlace o un QR antiguo puede resolver a un destino nuevo.
        Ambas respuestas usan `Cache-Control: no-store` para que
        caches conformes no reutilicen una redirección vencida. Las rutas
        de la aplicación (por ejemplo `/api`, `/error` y los archivos
        estáticos) están reservadas y nunca se emiten como alias.
      operationId: resolverEnlace
      parameters:
        - name: alias
          in: path
          required: true
          description: >
            Código público del enlace. Alfabeto de 58 símbolos
            `123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz`
            (sin `0`, `O`, `I` ni `l`), sensible a mayúsculas, longitud
            variable comenzando por un carácter.
          schema:
            type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{1,32}$'
      responses:
        '302':
          description: Asignación vigente; redirección al destino registrado.
          headers:
            Location:
              required: true
              description: URL de destino exactamente como fue registrada.
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
        '404':
          description: Alias desconocido o sin asignación vigente.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: no-store
          content:
            text/html:
              schema:
                type: string
                description: Página que contiene el mensaje «Este enlace no existe o venció».
components:
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - destination
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 8192
          description: >
            URL de destino absoluta con esquema `http` o `https`
            (RFC 3986) y host presente. El límite es de 8.192 caracteres:
            8.192 se acepta y 8.193 se rechaza completo, nunca truncado.

            Codificación exigida (caracteres internacionales):

            - El destino debe ser una URI formada solo por caracteres
              ASCII válidos según la gramática de RFC 3986 (los
              caracteres de control y los delimitadores fuera de lugar
              también se rechazan). Un destino con caracteres Unicode en
              crudo (en host, ruta, consulta o fragmento) se rechaza
              como `MALFORMED_DESTINATION`.
            - Un dominio internacional viaja en forma punycode
              (`xn--bcher-kva.ch`); el texto en ruta, consulta o
              fragmento viaja con percent-encoding UTF-8 (`%C3%A9`).
              Ambas formas válidas se aceptan y se conservan.
            - Un `%` que no forma un par de escape válido (`%zz`, `%2`,
              `%` suelto) se rechaza como `MALFORMED_DESTINATION`.
            - Los espacios sin codificar se rechazan; `%20` (en
              cualquier combinación de mayúsculas) se acepta.

            Conservación verbatim: parámetros de consulta repetidos,
            fragmento, credenciales incrustadas (`usuario:clave@`), puerto
            explícito y la codificación recibida se aceptan y se
            conservan exactamente, sin decodificar, normalizar ni
            reescribir. El servidor no consulta disponibilidad,
            autenticación ni permisos del destino: un destino inalcanzable
            de formato válido se acepta.

            Orígenes propios: se rechazan los destinos cuyo host y puerto
            efectivo (80/443 según el esquema cuando no hay puerto
            explícito) coinciden con los orígenes configurados del
            servicio: la dirección pública configurada, los equivalentes
            loopback (`localhost`, `127.0.0.1`, `::1`) del mismo puerto y
            los orígenes extra declarados en la configuración. La
            comparación es de origen: normaliza mayúsculas, punto final y
            corchetes IPv6, e ignora el esquema. Otro puerto u otro host
            de la red local no es origen propio y se acepta.
        aliasPersonalizado:
          type: string
          # Vacío equivale a ausente (enlace acortado): el patrón admite la
          # cadena vacía además de 1 a 50 caracteres válidos.
          maxLength: 50
          pattern: '^([a-zA-Z0-9-]{1,50})?$'
          description: >
            Alias que el usuario elige para su enlace personal (issue
            #21). Opcional: ausente, vacío o nulo produce un enlace
            acortado común; presente crea el enlace personal
            `/{namespace}/{aliasPersonalizado}` del usuario de la sesión.
            De 1 a 50 caracteres `a-z`, `0-9` y `-`, sin distinguir
            mayúsculas: se normaliza a minúsculas y se guarda así.
            Un formato inválido se rechaza con `ALIAS_INVALID`; sin
            sesión responde `401`, con sesión y sin namespace elegido
            `NAMESPACE_NOT_CHOSEN`, y repetir un alias propio vigente
            `ALIAS_TAKEN`.
          example: "mi-doc"
      additionalProperties: false
    LinkCreated:
      type: object
      required:
        - shortUrl
        - alias
        - expiresAt
        - reuseNotice
      properties:
        shortUrl:
          type: string
          format: uri
          description: >
            URL pública del enlace: dirección base configurada del
            servicio más `/{alias}` para un enlace acortado o
            `/{namespace}/{alias}` para un enlace personal. No se deriva
            de la solicitud recibida.
          example: "http://192.168.1.50:8080/7"
        alias:
          type: string
          pattern: '^([1-9A-HJ-NP-Za-km-z]{1,32}|[a-z0-9-]{1,50})$'
          description: >
            Código asignado: dentro del alfabeto acordado para un enlace
            acortado, o el alias personalizado normalizado a minúsculas
            para un enlace personal.
          example: "7"
        expiresAt:
          type: string
          format: date-time
          description: Instante de vencimiento, exactamente 60 minutos después de la creación.
        reuseNotice:
          type: string
          description: >
            Aviso al usuario de que el alias puede reutilizarse con otro
            destino después del vencimiento.
          example: "Este alias puede reutilizarse con otro destino después del vencimiento."
    CsrfToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: >
            Valor del token CSRF; la cookie `XSRF-TOKEN` lo repite (se fija
            cuando la solicitud no la trae) y se repite en el encabezado
            `X-XSRF-TOKEN` de los POST.
          example: "f1d2d2f9-4e5a-4b6c-8d7e-9f0a1b2c3d4e"
    ElegirNamespaceRequest:
      type: object
      required:
        - namespace
      additionalProperties: false
      properties:
        namespace:
          type: string
          description: >
            Nombre propuesto. Se normaliza a minúsculas antes de validar;
            el formato es de 3 a 30 caracteres `a-z`, `0-9` y `-`, sin
            guion inicial ni final.
          example: "juan"
    NamespaceSugerencia:
      type: object
      required:
        - sugerencia
      properties:
        sugerencia:
          type: string
          description: >
            Nombre sugerido a partir de la parte local del email, adaptado
            al formato del namespace. No se reserva automáticamente.
          example: "juan-perez"
    SesionActual:
      type: object
      required:
        - usuario
      properties:
        usuario:
          # En OpenAPI 3.0.3 `nullable` solo amplía el `type` del mismo
          # Schema Object: con un `$ref` o un `allOf` el validador sigue
          # exigiendo el objeto. Por eso el usuario va inline.
          nullable: true
          type: object
          description: >
            Usuario de la sesión actual; `null` cuando no hay sesión o la
            sesión no tiene usuario.
          required:
            - email
            - namespace
            - sugerencia
            - tipo
          properties:
            email:
              type: string
              format: email
              description: Email de la cuenta de Google del usuario.
              example: "juan@ejemplo.com"
            namespace:
              type: string
              description: >
                Namespace público elegido por el usuario; vacío hasta que lo
                elija en `POST /api/namespace`.
              example: ""
            sugerencia:
              type: string
              description: >
                Sugerencia para la pantalla del primer login, derivada de la
                parte local del email; vacía cuando el usuario ya tiene
                namespace.
              example: "juan"
            tipo:
              type: string
              description: >
                Tipo de la sesión actual: `principal` es la abierta con login
                directo de Google; `vinculada` se reserva para la vinculación
                por QR.
              enum:
                - principal
                - vinculada
              example: "principal"
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código estable del rechazo.
          enum:
            - EMPTY_DESTINATION
            - DESTINATION_TOO_LONG
            - MALFORMED_DESTINATION
            - UNSUPPORTED_SCHEME
            - OWN_ORIGIN
            - INVALID_REQUEST
            - CSRF_TOKEN_INVALID
            - NOT_AUTHENTICATED
            - NAMESPACE_INVALID
            - NAMESPACE_RESERVED
            - NAMESPACE_TAKEN
            - NAMESPACE_ALREADY_CHOSEN
            - NAMESPACE_NOT_CHOSEN
            - ALIAS_INVALID
            - ALIAS_TAKEN
        message:
          type: string
          description: Descripción legible del problema para mostrar al usuario.
      example:
        error: MALFORMED_DESTINATION
        message: "La URL de destino no tiene un formato válido."
