<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acortador de enlaces</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <!-- Sesión (issue #19): app.js muestra el acceso con Google o el
         usuario con sesión principal y su cierre. -->
    <div id="cuenta">
        <a id="cuenta-entrar" class="button-link" href="/oauth2/authorization/google" hidden>
            Entrar con Google
        </a>
        <span id="cuenta-usuario" hidden></span>
        <button id="cuenta-salir" type="button" hidden>Cerrar sesión</button>
    </div>
    <h1>Acortador de enlaces</h1>
    <!-- Elección del namespace (issue #20): visible con sesión y sin
         namespace; la sugerencia sale de la parte local del email. -->
    <section id="namespace" hidden>
        <h2>Elegí tu namespace</h2>
        <p class="notice">
            Es el nombre público de tus enlaces personales.
        </p>
        <form id="namespace-form" novalidate>
            <label for="namespace-input">Namespace</label>
            <div class="field-row">
                <input id="namespace-input" name="namespace" type="text"
                       autocomplete="off" spellcheck="false"
                       placeholder="juan">
                <button type="submit">Elegir</button>
            </div>
        </form>
        <p id="namespace-error" class="error" hidden></p>
    </section>
    <form id="shorten-form" novalidate>
        <label for="destination">Dirección a acortar</label>
        <div class="field-row">
            <input id="destination" name="destination" type="text" inputmode="url"
                   autocomplete="off" spellcheck="false"
                   placeholder="https://ejemplo.com/documento-muy-largo">
            <button type="submit">Acortar</button>
        </div>
        <!-- Alias personalizado (issue #21): con sesión principal y
             namespace elegido. Completo crea un enlace personal
             /{namespace}/{alias}; vacío crea un enlace acortado igual
             que en la etapa 1. -->
        <div id="alias-personal" hidden>
            <label for="alias-personalizado">Alias personalizado (opcional)</label>
            <div class="field-row">
                <input id="alias-personalizado" name="aliasPersonalizado" type="text"
                       autocomplete="off" spellcheck="false" maxlength="50"
                       placeholder="mi-doc">
            </div>
        </div>
    </form>
    <p id="error" class="error" hidden></p>
    <section id="result" hidden>
        <p>
            Tu enlace:
            <a id="short-url" href="#" target="_blank" rel="noopener"></a>
        </p>
        <p>Vence: <time id="expires-at"></time></p>
        <p id="reuse-notice" class="notice"></p>
        <figure id="qr-figure">
            <img id="qr-image" alt="Código QR del enlace acortado">
            <figcaption>El QR contiene tu enlace acortado.</figcaption>
        </figure>
        <p>
            <a id="qr-download" class="button-link" download>Descargar QR como PNG</a>
        </p>
    </section>
</main>
<script src="vendor/qrcode.js"></script>
<script src="qr-code.js"></script>
<script src="app.js"></script>
</body>
</html>
