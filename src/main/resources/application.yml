spring:
  application:
    name: link-shortener
  config:
    # Carga el .env del directorio de trabajo (formato properties, opcional).
    # Una variable de entorno real del proceso le gana a la del archivo.
    # ENV_FILE cambia la ruta; la tarea test de Gradle lo apunta a un
    # archivo inexistente para que las pruebas no dependan del .env local.
    import: optional:file:${ENV_FILE:.env}[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acortador}
    username: ${DB_USER:acortador}
    password: ${DB_PASSWORD:acortador}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail_on_unknown_properties: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

shortener:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  link-duration: ${LINK_DURATION:PT60M}
  own-origins: ${OWN_ORIGINS:}
  reserved-routes: ${RESERVED_ROUTES:api,error}
  alias-alphabet: ${ALIAS_ALPHABET:123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz}
  max-destination-length: ${MAX_DESTINATION_LENGTH:8192}
  # Si cambia ALIAS_ALPHABET hay que revisar este patrón: deben ser consistentes.
  alias-route-pattern: ${ALIAS_ROUTE_PATTERN:[1-9A-HJ-NP-Za-km-z]{1,32}}
