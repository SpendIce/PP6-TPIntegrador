spring:
  application:
    name: link-shortener
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acortador}
    username: ${DB_USER:acortador}
    password: ${DB_PASSWORD:acortador}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail_on_unknown_properties: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

shortener:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  link-duration: ${LINK_DURATION:PT60M}
  own-origins: ${OWN_ORIGINS:}
  reserved-routes: api, error
